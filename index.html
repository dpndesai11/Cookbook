<style>
/* Design tokens: the Summit design system (tokens.json), values unchanged. */
:root {
  --brand-night: #501c6e;
  --surface: #f7f7f5; --surface-raised: #ffffff; --surface-sunken: #f3f4f6;
  --border: #e5e7eb; --border-strong: #8e7e94;
  --ink: #000000; --ink-muted: #5f4f66;
  --primary: #501c6e; --primary-hover: #3b1551; --on-primary: #ffffff;
  --primary-soft: #f2e9f7; --primary-mid: #9467b0; --primary-low: #d9c4e7;
  --accent-ink: #b0009a; --focus-ring: #dd0dc4;
  --success: #0b7a75; --warning: #9a4a00; --danger: #c4262e;
  --shadow-sm: 0 1px 2px rgba(28,11,34,.08); --shadow-lg: 0 12px 32px rgba(28,11,34,.18);
  /* Category colours stay separate from status colours, as in the Summit apps. */
  --cat-main-bg: #f2e9f7;  --cat-main-fg: #501c6e;
  --cat-sauce-bg: #fdecd2; --cat-sauce-fg: #7a3a00;
  --cat-indian-bg: #d5f0ed; --cat-indian-fg: #075e5a;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-2xl: 24px; --radius-full: 9999px;
  --font-display: Montserrat, "Helvetica Neue", Arial, sans-serif;
  --font-sans: Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --surface: #14101f; --surface-raised: #211b34; --surface-sunken: #2e2648;
  --border: #352c52; --border-strong: #7f6ea6;
  --ink: #ffffff; --ink-muted: #bca8c3;
  --primary: #ce96ee; --primary-hover: #dfb6f7; --on-primary: #1e082b;
  --primary-soft: #392c4e; --primary-mid: #8f5db3; --primary-low: #4a2a63;
  --accent-ink: #ff75f2; --focus-ring: #ff75f2;
  --success: #4fd1c5; --warning: #fbbf24; --danger: #ff8a80;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.5); --shadow-lg: 0 12px 32px rgba(0,0,0,.6);
  --cat-main-bg: #392c4e;  --cat-main-fg: #ce96ee;
  --cat-sauce-bg: #4a3213; --cat-sauce-fg: #fbbf24;
  --cat-indian-bg: #123e3d; --cat-indian-fg: #4fd1c5;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 400 16px/24px var(--font-sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.icon { display: block; flex-shrink: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 448px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
@media (min-width: 768px) { .wrap { max-width: 896px; padding: var(--space-8) var(--space-6) 48px; } }

/* Header */
.top { display: flex; align-items: center; gap: var(--space-3); }
.appicon { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--brand-night); color: #fff; border-radius: var(--radius-xl); }
.top-text { flex: 1; min-width: 0; }
.eyebrow { font: 700 11px/14px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); margin: 0; }
.top h1 { font-size: 30px; line-height: 36px; font-weight: 800; }
.lead { margin: var(--space-4) 0 0; font-size: 16px; line-height: 24px; }

.iconbtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 0; border-radius: var(--radius-lg); background: transparent; transition: background-color .15s, transform .1s; }
.iconbtn:hover { background: var(--primary-soft); }
.iconbtn:active { transform: scale(.98); }
.iconbtn.boxed { background: var(--surface-raised); box-shadow: inset 0 0 0 1px var(--border-strong); }
.iconbtn.boxed:hover { background: var(--primary-soft); }

/* Search + categories */
.search { position: relative; margin-top: var(--space-6); }
.search .icon { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); pointer-events: none; }
.search input { width: 100%; height: 48px; padding: 0 var(--space-4) 0 44px; background: var(--surface-sunken); border: 1px solid var(--border-strong); border-radius: var(--radius-md); }
.search input::placeholder { color: var(--ink-muted); }
.cats { display: flex; gap: var(--space-2); margin-top: var(--space-3); overflow-x: auto; padding: 2px 2px var(--space-1); scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; min-height: 44px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-full); background: var(--surface-sunken); font-size: 14px; font-weight: 600; transition: background-color .15s, transform .1s; }
.chip:hover { background: var(--primary-soft); }
.chip:active { transform: scale(.98); }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }

/* Recipe list */
.list { display: grid; gap: var(--space-3); margin-top: var(--space-6); }
@media (min-width: 768px) { .list { grid-template-columns: 1fr 1fr; } }
.card { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-3); text-align: left; background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-2xl); transition: transform .1s; position: relative; }
.card:active { transform: scale(.98); }
.tile { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: var(--radius-xl); }
.cat-main { background: var(--cat-main-bg); color: var(--cat-main-fg); }
.cat-sauce { background: var(--cat-sauce-bg); color: var(--cat-sauce-fg); }
.cat-indian { background: var(--cat-indian-bg); color: var(--cat-indian-fg); }
.card-body { flex: 1; min-width: 0; }
.badge { display: inline-block; padding: 2px 10px; border-radius: var(--radius-full); font: 600 11px/14px var(--font-sans); }
.card-title { margin-top: var(--space-1); font: 700 18px/24px var(--font-display); }
.meta { display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 500; }
.meta .icon { color: var(--primary); }
.card .favbtn { margin: -8px -8px -8px 0; }
.card-open { position: absolute; inset: 0; border: 0; background: none; border-radius: var(--radius-2xl); }
.card .favbtn { position: relative; z-index: 1; }
.empty { grid-column: 1 / -1; text-align: center; padding: var(--space-8) 0; font-weight: 600; }
.fav-on { color: var(--accent-ink); }

/* Detail */
.bar { display: flex; align-items: center; justify-content: space-between; }
.hero { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9; margin-top: var(--space-4); border-radius: var(--radius-2xl); }
.d-title { margin-top: var(--space-3); font-size: 30px; line-height: 36px; font-weight: 800; }
.stats { display: flex; gap: var(--space-3); margin-top: var(--space-4); }
.stat { flex: 1; min-width: 0; padding: var(--space-3); background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-xl); }
.stat-label { font-size: 14px; line-height: 20px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.stat-label .icon { color: var(--primary); }
.stat-value { font: 700 24px/32px var(--font-display); font-variant-numeric: tabular-nums; }
.cols { display: grid; gap: var(--space-6); margin-top: var(--space-6); }
@media (min-width: 768px) { .cols { grid-template-columns: 1fr 1fr; align-items: start; } }
.panel { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-2xl); padding: var(--space-4); }
.panel h2 { display: flex; align-items: center; gap: var(--space-2); font-size: 18px; line-height: 24px; font-weight: 700; }
.panel h2 .icon { color: var(--primary); }
.panel h2 .count { margin-left: auto; font: 600 14px/20px var(--font-sans); font-variant-numeric: tabular-nums; }
.ings, .steps { list-style: none; margin: var(--space-3) 0 0; padding: 0; }
.ing { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: 44px; padding: var(--space-2) var(--space-1); text-align: left; border: 0; background: none; border-radius: var(--radius-md); }
.ing:hover { background: var(--primary-soft); }
.box { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 2px solid var(--border-strong); color: transparent; transition: background-color .15s; }
.ing[aria-checked="true"] .box { background: var(--success); border-color: var(--success); color: var(--surface-raised); animation: pulse .35s ease-out; }
.ing[aria-checked="true"] .txt { text-decoration: line-through; text-decoration-thickness: 2px; }
.steps li { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-1); }
.steps li + li { border-top: 1px solid var(--border); }
.num { width: 28px; height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full); background: var(--primary); color: var(--on-primary); font: 700 14px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.steps p { margin: 2px 0 0; }
.reset { margin-top: var(--space-2); min-height: 44px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--primary); font-weight: 600; font-size: 14px; }
.reset:hover { background: var(--primary-soft); }

.toast { position: fixed; top: var(--space-4); left: 50%; transform: translateX(-50%); z-index: 50; padding: var(--space-3) var(--space-5); border-radius: var(--radius-full); background: var(--surface-raised); border: 1px solid var(--border); box-shadow: var(--shadow-lg); font-weight: 600; font-size: 14px; animation: toast .25s ease-out; }
@keyframes toast { from { opacity: 0; transform: translate(-50%, -8px); } }
@keyframes pulse { 50% { transform: scale(1.08); } }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

  'cooking-pot': '<path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="m4 8 16-4"/><path d="m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8"/>',
  'flame': '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  'leaf': '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
  'chef-hat': '<path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z"/><path d="M6 17h12"/>',
  'moon': '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  'sun': '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
};
const icon = (name, size = 24, fill = false) =>
  `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

const CATEGORIES = ['All', 'Main Course', 'Pasta Sauce', 'Indian Cuisine'];
const CAT_CLASS = { 'Main Course': 'cat-main', 'Pasta Sauce': 'cat-sauce', 'Indian Cuisine': 'cat-indian' };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const state = {
  search: '', category: 'All',
  favorites: store.get('cookbook_favorites', {}),
  checked: store.get('cookbook_checked', {}),
};

/* Theme: follows the system, the toggle is remembered per device. */
const root = document.documentElement;
function systemTheme() { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
function applyTheme(t) {
  root.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = '#501c6e';
}
applyTheme(store.get('cookbook_theme', null) || systemTheme());

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 1800);
}

function themeButton() {
  const dark = root.dataset.theme === 'dark';
  return `<button class="iconbtn" data-act="theme" aria-label="${dark ? 'Switch to light mode' : 'Switch to dark mode'}">${icon(dark ? 'sun' : 'moon', 22)}</button>`;
}
function favButton(r, big) {
  const on = !!state.favorites[r.id];
  return `<button class="iconbtn favbtn${big ? ' boxed' : ''}${on ? ' fav-on' : ''}" data-act="fav" data-id="${r.id}" aria-pressed="${on}" aria-label="${on ? 'Remove' : 'Save'} ${esc(r.title)} ${on ? 'from' : 'to'} favourites">${icon('heart', 22, on)}</button>`;
}

function homeView() {
  const q = state.search.trim().toLowerCase();
  const shown = RECIPES.filter(r => (state.category === 'All' || r.category === state.category) && (!q || r.title.toLowerCase().includes(q)));
  const cards = shown.map(r => `
    <div class="card">
      <div class="tile ${CAT_CLASS[r.category]}">${icon(r.icon, 28)}</div>
      <div class="card-body">
        <span class="badge ${CAT_CLASS[r.category]}">${esc(r.category)}</span>
        <div class="card-title">${esc(r.title)}</div>
        <div class="meta">${icon('clock', 16)}${esc(r.time)}</div>
      </div>
      <a class="card-open" href="#/recipe/${r.id}" aria-label="Open ${esc(r.title)}"></a>
      ${favButton(r)}
    </div>`).join('');
  return `
    <header>
      <div class="top">
        <div class="appicon">${icon('utensils-crossed', 28)}</div>
        <div class="top-text"><p class="eyebrow">My kitchen</p><h1>Cookbook</h1></div>
        ${themeButton()}
      </div>
      <p class="lead">Tap a recipe to open the full guide and ingredient list.</p>
    </header>
    <div class="search">${icon('search', 20)}<input id="q" type="search" placeholder="Search recipes" aria-label="Search recipes" value="${esc(state.search)}" autocomplete="off"></div>
    <div class="cats" role="group" aria-label="Category">${CATEGORIES.map(c => `<button class="chip" data-act="cat" data-cat="${esc(c)}" aria-pressed="${c === state.category}">${esc(c)}</button>`).join('')}</div>
    <div class="list" id="list">${cards || '<p class="empty">No recipes match your search</p>'}</div>`;
}

function detailView(r) {
  const done = r.ingredients.filter((_, i) => state.checked[r.id + ':' + i]).length;
  return `
    <div class="bar">
      <a class="iconbtn boxed" href="#/" aria-label="Back to recipes" data-act="back">${icon('arrow-left', 22)}</a>
      <div style="display:flex;gap:8px">${favButton(r, true)}${themeButton()}</div>
    </div>
    <div class="hero ${CAT_CLASS[r.category]}">${icon(r.icon, 64)}</div>
    <span class="badge ${CAT_CLASS[r.category]}" style="margin-top:16px">${esc(r.category)}</span>
    <h1 class="d-title">${esc(r.title)}</h1>
    <div class="stats">
      <div class="stat"><div class="stat-label">${icon('clock', 16)}Time</div><div class="stat-value">${esc(r.time)}</div></div>
      <div class="stat"><div class="stat-label">${icon('users', 16)}Serves</div><div class="stat-value">${esc(r.servings.replace(/\s*servings?/i, ''))}</div></div>
    </div>
    <div class="cols">
      <section class="panel" aria-labelledby="h-ing">
        <h2 id="h-ing">${icon('shopping-basket', 22)}Ingredients<span class="count">${done} of ${r.ingredients.length}</span></h2>
        <ul class="ings">${r.ingredients.map((t, i) => {
          const on = !!state.checked[r.id + ':' + i];
          return `<li><button class="ing" role="checkbox" aria-checked="${on}" data-act="check" data-key="${r.id}:${i}"><span class="box">${icon('check', 16)}</span><span class="txt">${esc(t)}</span></button></li>`;
        }).join('')}</ul>
        ${done ? `<button class="reset" data-act="clear" data-id="${r.id}">Clear ticks</button>` : ''}
      </section>
      <section class="panel" aria-labelledby="h-steps">
        <h2 id="h-steps">${icon('list-ordered', 22)}Instructions</h2>
        <ol class="steps">${r.instructions.map((t, i) => `<li><span class="num">${i + 1}</span><p>${esc(t)}</p></li>`).join('')}</ol>
      </section>
    </div>`;
}

const app = document.getElementById('app');
function route() { const m = location.hash.match(/^#\/recipe\/([\w-]+)/); return m && RECIPES.find(r => r.id === m[1]); }

function render() {
  const r = route();
  const focusId = document.activeElement && document.activeElement.id;
  const scroll = window.scrollY;
  app.innerHTML = r ? detailView(r) : homeView();
  document.title = r ? `${r.title} · Cookbook` : "Cookbook";
  if (focusId === 'q') { const el = document.getElementById('q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  window.scrollTo(0, scroll);
}
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });

app.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  state.search = e.target.value; render();
});
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'theme') {
    const t = root.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(t); store.set('cookbook_theme', t); render();
  } else if (act === 'cat') {
    state.category = b.dataset.cat; render();
  } else if (act === 'fav') {
    const id = b.dataset.id; state.favorites[id] = !state.favorites[id];
    store.set('cookbook_favorites', state.favorites);
    toast(state.favorites[id] ? 'Saved to favourites' : 'Removed from favourites'); render();
  } else if (act === 'check') {
    const k = b.dataset.key; state.checked[k] = !state.checked[k];
    store.set('cookbook_checked', state.checked); render();
  } else if (act === 'clear') {
    const id = b.dataset.id;
    Object.keys(state.checked).forEach(k => { if (k.startsWith(id + ':')) delete state.checked[k]; });
    store.set('cookbook_checked', state.checked); render();
  }
});
render();
</script>
</body>
</html>
